# FRIDAY — configuration d'exemple.
# scripts/install.ps1 la copie vers config/friday.yaml (non versionné) : modifie cette copie.

language: fr

user:
  names: ["Mr", "Mr Chemmane"]   # façons dont FRIDAY s'adresse à l'utilisateur

wake_word:
  model: hey_jarvis     # "friday" une fois le modèle personnalisé entraîné (phase 10)
  threshold: 0.5
  hotkey: ctrl+alt+f    # push-to-talk global

audio:
  # Nom du périphérique tel qu'affiché par `friday devices` (un extrait suffit, accents et
  # majuscules ignorés), ou null pour le défaut Windows. S'il est débranché, FRIDAY
  # bascule sur le défaut Windows au lieu de planter.
  # Exemple : input_device: "Microphone sur casque (2- USB Audio Device)"
  input_device: null
  output_device: null
  sample_rate: 16000
  silence_seconds: 1.5  # fin de phrase si le VAD n'est pas disponible
  max_listen_seconds: 20

stt:
  engine: faster_whisper
  model: large-v3       # RTX 4070 Ti détectée ; "small" sur CPU seul
  device: cuda
  initial_prompt: "Friday, Claude, Claude Code, Haiku, Opus, Fable, session"

tts:
  enabled: true           # false : FRIDAY écrit sans parler
  engine: piper           # piper (voix neuronale locale) | windows_sapi ; repli automatique sur windows_sapi
  voice: fr_FR-siwis-medium   # ou fr_FR-upmc-medium (python -m piper.download_voices <voix> --download-dir models/piper)
  models_dir: models/piper
  length_scale: 1.0       # vitesse : > 1 plus lent, < 1 plus rapide

claude:
  binary: claude
  default_mode: claude  # claude | claude_code
  workspace: C:\Users\maxch\Friday\workspace
  persona_file: config/persona.md   # consignes de FRIDAY (équivalent du CLAUDE.md)
  request_timeout_seconds: 180
  permission_timeout_seconds: 30
  # Outils disponibles en mode Claude Code (le mode Claude n'en a aucun).
  code_tools: [Read, Edit, Write, Glob, Grep, Bash, PowerShell]
  # Outils utilisables sans confirmation ; le reste est refusé (phase 6 : confirmation vocale).
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - "Bash(dir *)"
    - "PowerShell(Get-ChildItem *)"
    - "Bash(python *)"
    - "Bash(git status *)"
    - "Bash(git log *)"
    - "Bash(start *)"
  # Toujours soumis à confirmation, même dans le dossier de travail (le mode acceptEdits
  # autoriserait sinon rm/Remove-Item sans rien demander). Tant que le serveur de
  # permission (phase 6) n'existe pas, ces actions sont refusées.
  confirm_tools:
    - "PowerShell(Remove-Item *)"
    - "PowerShell(ri *)"
    - "PowerShell(rm *)"
    - "PowerShell(del *)"
    - "PowerShell(erase *)"
    - "PowerShell(rd *)"
    - "PowerShell(rmdir *)"
    - "PowerShell(Clear-Content *)"
    - "PowerShell(Clear-Disk *)"
    - "PowerShell(Format-Volume *)"
    - "PowerShell(Stop-Computer *)"
    - "PowerShell(Restart-Computer *)"
    - "PowerShell(Stop-Process *)"
    - "PowerShell(Set-ItemProperty *)"
    - "PowerShell(Remove-ItemProperty *)"
    - "PowerShell(Uninstall-Package *)"
    - "PowerShell(Send-MailMessage *)"
    - "PowerShell(git push *)"
    - "PowerShell(git reset *)"
    - "PowerShell(git clean *)"
    - "Bash(rm *)"
    - "Bash(rmdir *)"
    - "Bash(del *)"
    - "Bash(format *)"
    - "Bash(diskpart *)"
    - "Bash(reg *)"
    - "Bash(shutdown *)"
    - "Bash(git push *)"
    - "Bash(git reset *)"
    - "Bash(git clean *)"

models:
  # Seuls les modèles validés en phase 0 (docs/environnement.md) sont listés.
  simple: haiku
  complex: opus
  available:
    haiku: { label: "Haiku 4.5", aliases: ["haiku", "aïcou", "aiku"] }
    opus: { label: "Opus 5.5", aliases: ["opus", "opus 5.5", "opus cinq cinq"] }
    fable: { label: "Fable 5.1", aliases: ["fable", "fable 5.1", "fable cinq un"] }

# Choix automatique du modèle, sans appeler Claude : question simple et courte -> models.simple,
# tout le reste (action, fichier, code, raisonnement, cas ambigu) -> models.complex.
# Accents et majuscules ignorés ; le dernier mot peut être conjugué (« crée » couvre « créez »).
router:
  simple_max_words: 20
  simple_patterns:
    - "qu'est-ce que"
    - "qu'est-ce qu"
    - "c'est quoi"
    - "combien"
    - "quelle heure"
    - "quel jour"
    - "quelle date"
    - "traduis"
    - "traduire"
    - "comment dit-on"
    - "définis"
    - "définition"
    - "que veut dire"
    - "que signifie"
    - "explique en une phrase"
    - "qui est"
    - "qui était"
    - "qui a"
    - "quand"
    - "où se trouve"
    - "où est"
    - "quelle est la capitale"
    - "quel est"
    - "quelle est"
  complex_patterns:
    - "crée"
    - "créer"
    - "modifie"
    - "corrige"
    - "ouvre"
    - "ouvrir"
    - "ouvrez"
    - "exécute"
    - "lance"
    - "cherche dans"
    - "recherche dans"
    - "analyse"
    - "refactorise"
    - "déploie"
    - "déployer"
    - "installe"
    - "compare"
    - "conçois"
    - "concevoir"
    - "concevez"
    - "planifie"
    - "organise"
    - "rédige"
    - "écris"
    - "écrire"
    - "résume"
    - "pourquoi ça plante"
    - "pourquoi ça marche pas"
    - "pourquoi ça ne marche pas"
    - "démontre"
    - "étape par étape"

ui:
  host: 127.0.0.1       # ne jamais exposer sur le réseau
  port: 8765
  theme: dark
